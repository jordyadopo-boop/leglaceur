name: Déployer sur GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    # Un commit dont le message contient « [wip] » est sauvegardé sans être mis en ligne.
    if: ${{ github.event_name == 'workflow_dispatch' || !contains(github.event.head_commit.message, '[wip]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Installer les dépendances
        run: npm ci
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
      - name: Calculer le chemin de base
        id: base
        run: |
          # Avec un domaine personnalisé (fichier public/CNAME), le site est servi à la racine.
          if [ -f public/CNAME ]; then echo "path=/" >> "$GITHUB_OUTPUT";
          else echo "path=/${GITHUB_REPOSITORY#*/}/" >> "$GITHUB_OUTPUT"; fi
      - name: Construire le site
        run: npm run build
        env:
          BASE_PATH: ${{ steps.base.outputs.path }}
          SITE_URL: ${{ vars.SITE_URL }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
